name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: install wiringPi
      run: |
        git clone --depth 1 https://github.com/WiringPi/WiringPi.git /tmp/WiringPi
        cd /tmp/WiringPi/wiringPi
        make
        sudo make install
        sudo ldconfig
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
